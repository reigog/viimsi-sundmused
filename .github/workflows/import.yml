name: Impordi praegune leht
on:
  push:
    paths: ['.github/workflows/import.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p viimsisundmused2
          curl -fsSL -A "Mozilla/5.0" https://paremveebileht.ee/viimsisundmused2/ -o viimsisundmused2/index.html
          wc -c viimsisundmused2/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viimsisundmused2/index.html
          git commit -m "Impordi praegune viimsisundmused2 leht" || echo "muudatusi pole"
          git push
